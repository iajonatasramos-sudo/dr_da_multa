<!doctype html>
<!-- Modelo da imagem de Open Graph (1200×630). Gere com: node scripts/og.mjs -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(120% 90% at 85% 0%, #123A7A 0%, #0A1A3F 55%, #071331 100%); font-family: Manrope, sans-serif; position: relative; }
  svg.waves { position: absolute; inset: auto 0 0 0; width: 100%; height: 75%; }
  .text { position: absolute; left: 72px; top: 92px; width: 640px; }
  .seal { display: flex; align-items: center; gap: 16px; color: #C9A55C; font-size: 18px; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; }
  .seal::before, .seal::after { content: ""; width: 40px; height: 1px; background: currentColor; }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; color: #F4EBD9; font-size: 104px; line-height: .95; margin-top: 30px; }
  p { color: #DCE4F2; font-size: 28px; margin-top: 34px; line-height: 1.35; }
  .cover { position: absolute; right: 78px; top: 70px; width: 330px; transform: perspective(900px) rotateY(-14deg); box-shadow: 24px 30px 50px -10px rgba(0,0,0,.8), 0 0 0 1px rgba(201,165,92,.3); border-radius: 4px; }
</style>
</head>
<body>
  <svg class="waves" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" id="w"></svg>
  <div class="text">
    <div class="seal">E-book gratuito</div>
    <h1>O Mar Azul da Advocacia</h1>
    <p>Direito das Telecomunicações: o nicho que quase nenhum advogado enxerga.</p>
  </div>
  <img class="cover" src="../public/img/capa-ebook-720.webp" alt="">
  <script>
    const w = document.getElementById('w');
    for (let i = 0; i < 22; i++) {
      const t = i / 21, y0 = 700 + t * 260, y1 = 360 + t * 300, s = 70 + Math.sin(i * 1.7) * 40;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M -60 ${y0} C 380 ${y0 - s}, 760 ${y1 + s * 1.4}, 1500 ${y1}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#38C6F4');
      p.setAttribute('stroke-opacity', 0.1 + ((i * 37) % 11) / 30); p.setAttribute('stroke-width', 0.8 + ((i * 13) % 5) / 5);
      w.appendChild(p);
    }
  </script>
</body>
</html>
