<!doctype html>
<!-- Modelo da imagem de Open Graph da imersão (1200×630). Gere com: node scripts/og.mjs imersao
     Datas: ajuste aqui se mudarem em src/config/imersao.ts -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(120% 90% at 85% 0%, #123A7A 0%, #0A1A3F 55%, #071331 100%); font-family: Manrope, sans-serif; position: relative; }
  svg.waves { position: absolute; inset: auto 0 0 0; width: 100%; height: 70%; }
  .text { position: absolute; left: 72px; top: 78px; width: 640px; }
  .seal { display: flex; align-items: center; gap: 16px; color: #C9A55C; font-size: 17px; letter-spacing: .26em; text-transform: uppercase; font-weight: 600; }
  .seal::before { content: ""; width: 40px; height: 1px; background: currentColor; }
  h1 { font-family: "DM Serif Display", serif; font-weight: 400; color: #F4EBD9; font-size: 104px; line-height: .95; margin-top: 28px; }
  .dates { display: flex; gap: 14px; margin-top: 40px; }
  .chip { border: 1px solid rgba(201,165,92,.5); border-radius: 12px; padding: 14px 20px; color: #F4EBD9; font-size: 26px; font-weight: 700; background: rgba(7,19,49,.6); }
  .chip small { display: block; color: #A9B7D0; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
  .by { margin-top: 30px; color: #DCE4F2; font-size: 22px; }
  .photo { position: absolute; right: 64px; top: 56px; width: 380px; height: 475px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(201,165,92,.4); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(to top, #0A1A3F, rgba(10,26,63,.6), transparent); }
</style>
</head>
<body>
  <svg class="waves" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" id="w"></svg>
  <div class="photo"><img src="../public/img/jason-840.webp" alt=""></div>
  <div class="text">
    <div class="seal">Online e ao vivo</div>
    <h1>Imersão Telecom ADV</h1>
    <div class="dates">
      <div class="chip"><small>Dia 1</small>01/12 · 19h30</div>
      <div class="chip"><small>Dia 2</small>02/12 · 19h30</div>
    </div>
    <p class="by">com o Dr. Jason de Cerqueira Cesar</p>
  </div>
  <script>
    const w = document.getElementById('w');
    for (let i = 0; i < 22; i++) {
      const t = i / 21, y0 = 700 + t * 260, y1 = 360 + t * 300, s = 70 + Math.sin(i * 1.7) * 40;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', `M -60 ${y0} C 380 ${y0 - s}, 760 ${y1 + s * 1.4}, 1500 ${y1}`);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#38C6F4');
      p.setAttribute('stroke-opacity', 0.1 + ((i * 37) % 11) / 30); p.setAttribute('stroke-width', 0.8 + ((i * 13) % 5) / 5);
      w.appendChild(p);
    }
  </script>
</body>
</html>
