server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy do Dokploy (Traefik): redirects relativos, sem porta/host interno
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # JS/CSS/fontes do Next têm hash no nome: cache de 1 ano
    location /_next/static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        try_files $uri =404;
    }

    location /ebook/ {
        expires 7d;
        try_files $uri =404;
    }

    # Agenda da imersão: o mime.types padrão do nginx não conhece .ics
    location ~* \.ics$ {
        types { }
        default_type "text/calendar; charset=utf-8";
        expires -1;
        try_files $uri =404;
    }

    # Páginas: / , /obrigado/ , /imersao/ , /imersao/obrigado/ , /privacidade/ , /termos/ (sempre revalidadas)
    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
