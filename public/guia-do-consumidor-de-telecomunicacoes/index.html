<script type="module">

    // Configuração lida do bloco no topo do arquivo ↑
    // (PDF_URL, PRODUCT_PRICE, PAYMENT_URL, POPUP_DELAY_SECONDS)

    // ============================================
    // PDF.JS SETUP
    // ============================================
    const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let isRendering = false;
    let isAnimating = false;

    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('pdf-canvas-wrapper');
    const pageContainer = document.getElementById('pdf-page-container');
    const loading = document.getElementById('pdf-loading');
    const controls = document.getElementById('pdf-controls');
    const pageCounter = document.getElementById('page-counter');
    const pageInfo = document.getElementById('page-info');
    const progressBar = document.getElementById('pdf-progress');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // Elementos do Popup
    const popupTitle = document.getElementById('popup-title');
    const popupPrice = document.getElementById('popup-price');
    const popupSaveLink = document.getElementById('popup-save-link');

    let autoPopupTimer = null;

    // ============================================
    // LOGO SWITCHER (crossfade every 6s)
    // ============================================
    // Logo switcher removido — Dr. Da Multa usa logo única

    // ============================================
    // LOAD PDF
    // ============================================
    async function loadPDF() {
        try {
            const loadingTask = pdfjsLib.getDocument(PDF_URL);
            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;

            loading.style.display = 'none';
            wrapper.style.display = 'block';
            controls.style.display = 'flex';

            await renderPage(currentPage);
            updateUI();
            lucide.createIcons();

            // Injetar variáveis de configuração no popup
            if (popupPrice) popupPrice.textContent = PRODUCT_PRICE;
            if (popupSaveLink) popupSaveLink.href = PAYMENT_URL;

            // Botão de download aparece após 6 segundos
            setTimeout(() => {
                controls.classList.add('visible');
            }, 6000);

            // Iniciar o timer do popup automático (30 segundos)
            startAutoPopupTimer();
        } catch (err) {
            loading.innerHTML = `
                <div style="color: rgba(239,68,68,0.7); text-align:center;">
                    <p class="text-sm uppercase tracking-[0.15em] mb-2">Erro ao carregar PDF</p>
                    <p class="text-xs font-light" style="color:rgba(255,255,255,0.3);">${err.message}</p>
                </div>
            `;
        }
    }

    // ============================================
    // RENDER PAGE
    // ============================================
    async function renderPage(pageNum) {
        if (isRendering) return;
        isRendering = true;

        const page = await pdfDoc.getPage(pageNum);
        const containerWidth = wrapper.clientWidth;
        const viewport = page.getViewport({ scale: 1 });
        const scale = (containerWidth * window.devicePixelRatio) / viewport.width;
        const scaledViewport = page.getViewport({ scale });

        canvas.width = scaledViewport.width;
        canvas.height = scaledViewport.height;
        canvas.style.width = containerWidth + 'px';
        canvas.style.height = (containerWidth * viewport.height / viewport.width) + 'px';

        await page.render({
            canvasContext: ctx,
            viewport: scaledViewport,
        }).promise;

        isRendering = false;
    }

    // ============================================
    // NAVIGATION
    // ============================================
    async function goToPage(pageNum, direction) {
        if (isAnimating || isRendering || pageNum < 1 || pageNum > totalPages || pageNum === currentPage) return;
        isAnimating = true;

        const exitClass = direction === 'next' ? 'flipping-left' : 'flipping-right';
        const enterClass = direction === 'next' ? 'entering-from-right' : 'entering-from-left';

        pageContainer.classList.add(exitClass);

        await new Promise(r => setTimeout(r, 300));

        currentPage = pageNum;
        await renderPage(currentPage);
        updateUI();

        pageContainer.classList.remove(exitClass);
        pageContainer.classList.add(enterClass);

        await new Promise(r => setTimeout(r, 450));

        pageContainer.classList.remove(enterClass);
        isAnimating = false;
    }

    window.goToNextPage = function () {
        if (currentPage < totalPages) goToPage(currentPage + 1, 'next');
    };

    window.goToPrevPage = function () {
        if (currentPage > 1) goToPage(currentPage - 1, 'prev');
    };

    // ============================================
    // UI UPDATE
    // ============================================
    function updateUI() {
        pageCounter.textContent = `${currentPage} / ${totalPages}`;
        pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;

        const progress = (currentPage / totalPages) * 100;
        progressBar.style.width = progress + '%';

        btnPrev.classList.toggle('disabled', currentPage <= 1);
        btnNext.classList.toggle('disabled', currentPage >= totalPages);
    }

    // ============================================
    // SWIPE / TOUCH GESTURE
    // ============================================
    let touchStartX = 0;
    let touchStartY = 0;
    let touchCurrentX = 0;
    let isDragging = false;
    let isHorizontalSwipe = null;
    const SWIPE_THRESHOLD = 50;

    wrapper.addEventListener('touchstart', (e) => {
        if (isAnimating) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchCurrentX = touchStartX;
        isDragging = true;
        isHorizontalSwipe = null;
        pageContainer.classList.add('dragging');
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
        if (!isDragging || isAnimating) return;
        touchCurrentX = e.touches[0].clientX;
        const deltaX = touchCurrentX - touchStartX;
        const deltaY = e.touches[0].clientY - touchStartY;

        // Determine swipe direction on first significant move
        if (isHorizontalSwipe === null && (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10)) {
            isHorizontalSwipe = Math.abs(deltaX) > Math.abs(deltaY);
        }

        if (!isHorizontalSwipe) return;

        // Limit drag if at boundaries
        let clampedDelta = deltaX;
        if ((currentPage <= 1 && deltaX > 0) || (currentPage >= totalPages && deltaX < 0)) {
            clampedDelta = deltaX * 0.2; // rubberband effect
        }

        const rotateY = (clampedDelta / wrapper.clientWidth) * -12;
        const opacity = 1 - Math.abs(clampedDelta) / wrapper.clientWidth * 0.4;

        pageContainer.style.transform = `translateX(${clampedDelta}px) rotateY(${rotateY}deg)`;
        pageContainer.style.opacity = Math.max(0.3, opacity);
    }, { passive: true });

    wrapper.addEventListener('touchend', async (e) => {
        if (!isDragging) return;
        isDragging = false;
        pageContainer.classList.remove('dragging');

        const deltaX = touchCurrentX - touchStartX;

        if (isHorizontalSwipe && Math.abs(deltaX) > SWIPE_THRESHOLD) {
            if (deltaX < 0 && currentPage < totalPages) {
                // Swipe left = next page
                pageContainer.style.transform = '';
                pageContainer.style.opacity = '';
                await goToPage(currentPage + 1, 'next');
                return;
            } else if (deltaX > 0 && currentPage > 1) {
                // Swipe right = prev page
                pageContainer.style.transform = '';
                pageContainer.style.opacity = '';
                await goToPage(currentPage - 1, 'prev');
                return;
            }
        }

        // Snap back
        pageContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.35s ease';
        pageContainer.style.transform = 'translateX(0) rotateY(0)';
        pageContainer.style.opacity = '1';
        setTimeout(() => {
            pageContainer.style.transition = '';
        }, 350);
    }, { passive: true });

    // Mouse swipe support (desktop)
    let mouseStartX = 0;
    let mouseDown = false;

    wrapper.addEventListener('mousedown', (e) => {
        if (isAnimating) return;
        mouseDown = true;
        mouseStartX = e.clientX;
        pageContainer.classList.add('dragging');
        e.preventDefault();
    });

    wrapper.addEventListener('mousemove', (e) => {
        if (!mouseDown || isAnimating) return;
        const deltaX = e.clientX - mouseStartX;

        let clampedDelta = deltaX;
        if ((currentPage <= 1 && deltaX > 0) || (currentPage >= totalPages && deltaX < 0)) {
            clampedDelta = deltaX * 0.2;
        }

        const rotateY = (clampedDelta / wrapper.clientWidth) * -12;
        const opacity = 1 - Math.abs(clampedDelta) / wrapper.clientWidth * 0.4;

        pageContainer.style.transform = `translateX(${clampedDelta}px) rotateY(${rotateY}deg)`;
        pageContainer.style.opacity = Math.max(0.3, opacity);
    });

    document.addEventListener('mouseup', async (e) => {
        if (!mouseDown) return;
        mouseDown = false;
        pageContainer.classList.remove('dragging');

        const deltaX = e.clientX - mouseStartX;

        if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
            if (deltaX < 0 && currentPage < totalPages) {
                pageContainer.style.transform = '';
                pageContainer.style.opacity = '';
                await goToPage(currentPage + 1, 'next');
                return;
            } else if (deltaX > 0 && currentPage > 1) {
                pageContainer.style.transform = '';
                pageContainer.style.opacity = '';
                await goToPage(currentPage - 1, 'prev');
                return;
            }
        }

        pageContainer.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.35s ease';
        pageContainer.style.transform = 'translateX(0) rotateY(0)';
        pageContainer.style.opacity = '1';
        setTimeout(() => {
            pageContainer.style.transition = '';
        }, 350);
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') window.goToPrevPage();
        if (e.key === 'ArrowRight') window.goToNextPage();
    });



    // ============================================
    // RESIZE HANDLER
    // ============================================
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            if (pdfDoc && !isRendering && !isAnimating) {
                renderPage(currentPage);
            }
        }, 250);
    });

    // ============================================
    // DOWNLOAD POPUP & TIMERS
    // ============================================
    const overlay = document.getElementById('pdf-download-overlay');

    function startAutoPopupTimer() {
        if (autoPopupTimer) clearTimeout(autoPopupTimer);
        autoPopupTimer = setTimeout(() => {
            openDownloadPopup('Importante...');
        }, POPUP_DELAY_SECONDS * 1000);
    }

    window.openDownloadPopup = function (customTitle = 'Boa ideia!') {
        // Atualiza o título dinamicamente
        if (popupTitle) popupTitle.textContent = customTitle;

        // Cancela o timer automático se o popup for aberto (manualmente ou pelo próprio timer)
        if (autoPopupTimer) {
            clearTimeout(autoPopupTimer);
            autoPopupTimer = null;
        }

        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeDownloadPopup = function () {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
    };

    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) window.closeDownloadPopup();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.closeDownloadPopup();
    });

    // ============================================
    // INIT
    // ============================================
    loadPDF();

</script>
